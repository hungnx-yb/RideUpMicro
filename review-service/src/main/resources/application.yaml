server:
  port: 8089
  servlet:
    context-path: /api/review

spring:
  application:
    name: review-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/review_service_db
    redis:
      host: rideupmicroredis-hung2307xuan-bff7.f.aivencloud.com
      port: 27742
      username: default
      password: AVNS_w8vWRSdFiTovQJ277R8
      timeout: 10s
      ssl:
        enabled: true
  cache:
    type: redis

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: review-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: manual_immediate
      observation-enabled: true
    template:
      observation-enabled: true
    retry:
      topic:
        enabled: true
        attempts: 4
        delay: 2000
        multiplier: 1.5
        dlt-enabled: true

app:
  kafka:
    topics:
      driver-rating-updated: driver-rating-updated


